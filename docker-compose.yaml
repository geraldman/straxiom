services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment: [POSTGRES_PASSWORD]
    volumes: [pgdata:/var/lib/postgresql/data]

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    environment: [ZO_ROOT_USER_EMAIL, ZO_ROOT_USER_PASSWORD, ZO_DATA_DIR]
    volumes: [o2data:/data]
    ports: ["192.168.100.10:5080:5080"]

  vector:
    image: timberio/vector:0.61.0-alpine@sha256:3bb7ed5152910ed51729e256937b1d8a4bf67ff624e9d565e8e5877bffd015c7
    # Vector >= 0.57 does not expand ${VAR} in its config unless this is set (credentials come from .env)
    environment: [ZO_ROOT_USER_EMAIL, ZO_ROOT_USER_PASSWORD, VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true]
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./testdata:/testdata:ro
    depends_on: [openobserve]

volumes: { pgdata: {}, o2data: {} }