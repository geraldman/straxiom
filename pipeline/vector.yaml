sources:
  testdata:
    type: file
    include: ["/testdata/*.log"]
    read_from: beginning

sinks:
  openobserve:
    type: http
    inputs: [testdata]
    uri: http://openobserve:5080/api/default/default/_json
    method: post
    auth:
      strategy: basic
      user: "${ZO_ROOT_USER_EMAIL}"
      password: "${ZO_ROOT_USER_PASSWORD}"
    compression: gzip
    encoding:
      codec: json
      timestamp_format: rfc3339
    healthcheck:
      enabled: true
      uri: http://openobserve:5080/healthz
